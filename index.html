<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic Schedule Builder</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  </head>
  <body>
    <header>
      <div class="header-content">
        <img src="assets/IFL-Logo.png" alt="IFL Logo" class="main-logo" />
        <h1>Academic Schedule Builder</h1>
      </div>
    </header>

    <main class="container">
      <div class="tabs-container">
        <button class="tab-btn active" data-mode="intensive">Intensive</button>
        <button class="tab-btn" data-mode="teens">Teens</button>
        <button class="tab-btn" data-mode="kids">Kids</button>
        <button class="tab-btn" data-mode="c2">C2</button>
      </div>

      <section class="config-panel">
        <form id="scheduleForm">
          <div class="form-grid">
            <div class="field">
              <label>Language</label>
              <select id="language">
                <option value="English" selected>English</option>
                <option value="Italian">Italian</option>
                <option value="Portuguese">Portuguese</option>
                <option value="French">French</option>
              </select>
            </div>
            <div class="field">
              <label>Level</label>
              <select id="level"></select>
            </div>
            <div class="field">
              <label>Days</label>
              <select id="days"></select>
            </div>
            <div class="field schedule-field">
              <label>Schedule</label>
              <div class="time-inputs">
                <input type="time" id="from" value="08:00" />
                <button type="button" id="toggleAmPm" class="btn-toggle">
                  <span class="label-am">AM</span>
                  <span class="label-pm">PM</span>
                </button>
                <input type="time" id="to" value="10:00" readonly />
              </div>
            </div>
          </div>
          <br />

          <div class="form-grid second-row">
            <div class="field">
              <label>Teacher</label>
              <input type="text" id="teacher" placeholder="Teacher's name" />
            </div>
            <div class="field">
              <label>Start Date</label>
              <input type="date" id="startDate" />
            </div>
            <div class="field">
              <label>Local Holidays</label>
              <input
                type="text"
                id="customHolidays"
                placeholder="e.g. 15/03/2026"
              />
            </div>
          </div>

          <div class="actions">
            <button type="button" id="generateBtn" class="btn-primary">
              Update Preview
            </button>
            <button type="button" id="downloadPdf" class="btn-secondary">
              Download PDF
            </button>
          </div>
        </form>
      </section>

      <section class="preview-panel">
        <div id="pdf-wrapper">
          <div id="capture-area" class="schedule-paper"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-content">
        <p><strong>IFL Idiomas</strong> - Academic Management Tool</p>
        <p>
          Developed by <strong>Víctor M. Sáa</strong> | Div 4 Pedagogical
          Director
        </p>
        <p class="copyright">© 2026 All Rights Reserved. Internal Use Only.</p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
